<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>scar_belle's love life</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0f1a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; user-select:none; }
  #game { display:block; position:absolute; inset:0; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:20; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .pill { background:rgba(255,255,255,.94); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; color:#1a2233; box-shadow:0 3px 10px rgba(0,0,0,.25); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .pill b { color:#0a7a4a; }
  .statbar { width:64px; height:8px; background:#e5e7eb; border-radius:6px; overflow:hidden; display:inline-block; }
  .statbar i { display:block; height:100%; border-radius:6px; transition:width .4s; }

  /* ---------- bottom nav ---------- */
  #nav { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:rgba(20,25,40,.92); padding:8px; border-radius:22px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  #nav button { background:transparent; border:none; color:#cdd6e4; font-size:11px; font-weight:600; padding:6px 12px; border-radius:14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:58px; }
  #nav button span { font-size:20px; }
  #nav button.active, #nav button:hover { background:#16a34a; color:#fff; }

  /* ---------- chat ---------- */
  #chatToggle { position:absolute; bottom:96px; right:12px; z-index:25; background:#7c3aed; color:#fff; border:none; border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(124,58,237,.5); font-size:13px; }
  #chatPanel { position:absolute; bottom:150px; right:12px; width:300px; max-width:82vw; height:340px; background:rgba(15,20,35,.96); border-radius:18px; z-index:25; display:none; flex-direction:column; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.08); }
  #chatPanel.open { display:flex; }
  #chatHead { padding:10px 14px; font-weight:700; color:#fff; font-size:13px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; }
  #chatHead .dot { color:#4ade80; }
  #chatMsgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .cmsg { background:rgba(255,255,255,.08); border-radius:12px; padding:7px 10px; color:#e5e7eb; font-size:12px; max-width:88%; }
  .cmsg b { color:#a5b4fc; }
  .cmsg.me { background:#16a34a; align-self:flex-end; color:#fff; }
  .cmsg.me b { color:#dcfce7; }
  #chatInput { display:flex; padding:8px; gap:6px; border-top:1px solid rgba(255,255,255,.08); }
  #chatInput input { flex:1; background:rgba(255,255,255,.1); border:none; border-radius:10px; padding:8px 10px; color:#fff; font-size:12px; outline:none; }
  #chatInput button { background:#7c3aed; border:none; color:#fff; border-radius:10px; padding:0 14px; font-weight:700; cursor:pointer; }

  /* ---------- modal ---------- */
  #modalWrap { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  #modalWrap.open { display:flex; }
  #modal { background:#fff; width:100%; max-width:480px; max-height:78vh; overflow-y:auto; border-radius:26px 26px 0 0; padding:20px 18px 30px; animation:slideUp .28s ease; }
  @keyframes slideUp { from { transform:translateY(60px); opacity:.4; } to { transform:translateY(0); opacity:1; } }
  #modal h2 { font-size:20px; margin-bottom:4px; color:#111827; }
  #modal .sub { color:#6b7280; font-size:13px; margin-bottom:14px; }
  .act { width:100%; text-align:left; background:#f3f4f6; border:none; border-radius:14px; padding:13px 14px; margin-bottom:8px; cursor:pointer; font-size:14px; font-weight:600; color:#111827; display:flex; justify-content:space-between; align-items:center; transition:background .15s; }
  .act:hover { background:#e5e7eb; }
  .act small { color:#6b7280; font-weight:500; }
  .act.green { background:#16a34a; color:#fff; } .act.green small { color:#dcfce7; }
  .act.red { background:#fee2e2; color:#991b1b; }
  .act:disabled { opacity:.45; cursor:not-allowed; }

  /* ---------- toasts ---------- */
  #toasts { position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:92vw; }
  .toast { background:rgba(17,24,39,.94); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.4); animation:tin .3s ease; max-width:92vw; text-align:center; }
  @keyframes tin { from { transform:translateY(-14px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  #prompt { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); z-index:15; background:rgba(17,24,39,.92); color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600; display:none; }
  #bigTitle { position:absolute; top:34%; left:0; right:0; text-align:center; z-index:60; pointer-events:none; opacity:0; transition:opacity .5s; }
  #bigTitle h1 { font-size:34px; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill">🌙 <span id="clock">8:00 AM</span></div>
  <div class="pill">😊 <span class="statbar"><i id="bHappy" style="background:#f59e0b"></i></span></div>
  <div class="pill">🍗 <span class="statbar"><i id="bHunger" style="background:#ef4444"></i></span></div>
  <div class="pill">⚡ <span class="statbar"><i id="bEnergy" style="background:#3b82f6"></i></span></div>
  <div class="pill">🧼 <span class="statbar"><i id="bHygiene" style="background:#06b6d4"></i></span></div>
  <div class="pill">💰 <b id="money">₦100,000</b></div>
</div>

<div id="prompt"></div>
<div id="toasts"></div>
<div id="bigTitle"><h1 id="bigTitleText"></h1></div>

<div id="nav">
  <button id="nMap" class="active"><span>🗺️</span>Map</button>
  <button id="nTravel"><span>🚕</span>Travel</button>
  <button id="nPhone"><span>📱</span>Phone</button>
  <button id="nHome"><span>🏠</span>Home</button>
</div>

<button id="chatToggle">💬 <span id="onlineCount">12</span> online</button>
<div id="chatPanel">
  <div id="chatHead"><span>👥 Lagos Chat <span class="dot">● live</span></span><span style="cursor:pointer" onclick="toggleChat()">✕</span></div>
  <div id="chatMsgs"></div>
  <div id="chatInput"><input id="chatText" placeholder="Say something..." maxlength="120"><button onclick="sendChat()">Send</button></div>
</div>

<div id="modalWrap" onclick="if(event.target===this)closeModal()">
  <div id="modal"></div>
</div>

<script>
/* =====================================================================
   scar_belle's love life — a Lagos life simulator (single file)
   ===================================================================== */
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

const rand = (a,b)=>a+Math.random()*(b-a);
const irand = (a,b)=>Math.floor(rand(a,b+1));
const pick = a=>a[irand(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fmt = n=>'₦'+Math.round(n).toLocaleString('en-NG');

/* ---------------- STATE ---------------- */
const DEF = {
  money:100000, happy:80, hunger:75, energy:90, hygiene:85,
  x:430, y:980, mode:'map', spouse:null, baby:false, married:false,
  day:1, hour:8, jobLevel:1, shiftsDone:0, furniture:['bed','chair','cooler'],
  met:[], thugRepelled:0, home:'Self-contain · Yaba'
};
let S = JSON.parse(localStorage.getItem('sb_lovelife')||'null') || JSON.parse(JSON.stringify(DEF));
function save(){ localStorage.setItem('sb_lovelife', JSON.stringify(S)); }

/* ---------------- WORLD ---------------- */
const WORLD = { w:2600, h:1700 };
// roads: horizontal & vertical strips
const ROADS_H = [300, 700, 1100, 1450];
const ROADS_V = [380, 900, 1400, 1900, 2300];
const SIDE = 46; // sidewalk offset

const LOCS = [
  { id:'home',   name:'Home',            emoji:'🏠', x:430,  y:980,  color:'#fde68a' },
  { id:'beach',  name:'Elegushi Beach',  emoji:'🏖️', x:2280, y:1420, color:'#fef3c7' },
  { id:'office', name:'Corporate Office',emoji:'🏢', x:1500, y:340,  color:'#dbeafe' },
  { id:'market', name:'Oja Market',      emoji:'🛒', x:980,  y:1120, color:'#dcfce7' },
  { id:'club',   name:'Quilox Club',     emoji:'🎉', x:1950, y:720,  color:'#fae8ff' },
  { id:'gym',    name:'i-Fitness Gym',   emoji:'💪', x:700,  y:360,  color:'#fee2e2' },
  { id:'police', name:'Police Station',  emoji:'🚔', x:1200, y:1470, color:'#e0e7ff' },
  { id:'church', name:'Love Chapel',     emoji:'💒', x:1660, y:1090, color:'#fce7f3' },
  { id:'salon',  name:'Mama Bisi Salon', emoji:'💇', x:500,  y:690,  color:'#ffedd5' },
  { id:'resto',  name:'Amala Shitta',    emoji:'🍲', x:1350, y:700,  color:'#fef9c3' },
  { id:'shop',   name:'The Palms Mall',  emoji:'🛍️', x:2100, y:1080, color:'#f1f5f9' },
];
const loc = id=>LOCS.find(l=>l.id===id);

/* fake online players */
const NAMES = ['yung_omo','big_tunde','lagos_babe','kiki_wiz','dj_slim','ada_ng','chief_obi','sisi_naija','raptor_boy','mama_afia','oga_musa','temi_xx','dami_dre','nneka','koko_blaze','fine_boy_T','wendy_ng','jide_jr'];
const PLAYERS = NAMES.map((n,i)=>({
  name:n, x:rand(300,WORLD.w-300), y:rand(300,WORLD.h-300),
  tx:0, ty:0, speed:rand(35,65), emoji:pick(['🧍','👩','👨','🧑','👱‍♀️','👱']),
  color:pick(['#8d5524','#a0663a','#5d4037','#c68642','#4a2f22']),
  idle:rand(0,10)
}));
PLAYERS.forEach(p=>{ p.tx=p.x; p.ty=p.y; });

/* pedestrians (locals, denser crowd) */
const PEDS = [];
for(let i=0;i<28;i++){
  PEDS.push({ x:rand(100,WORLD.w-100), y:pick(ROADS_H)+pick([-SIDE,SIDE]), dir:pick([-1,1]), speed:rand(25,55),
    emoji:pick(['🧍','👩','👨','🧑']), color:pick(['#8d5524','#a0663a','#5d4037','#c68642','#3e2723']) });
}

/* cars */
const CARS = [];
for(let i=0;i<10;i++){
  const lane = pick(ROADS_H);
  CARS.push({ x:rand(0,WORLD.w), y:lane+pick([-16,16]), dir:pick([-1,1]), speed:rand(90,160),
    color:pick(['#facc15','#f8fafc','#ef4444','#22c55e','#3b82f6']), kind:pick(['danfo','car','keke']) });
}

/* ---------------- TIME ---------------- */
let timeAcc=0;
function tickTime(dt){
  timeAcc += dt;
  if(timeAcc>=8){ timeAcc=0; S.hour++;
    S.hunger=clamp(S.hunger-1.1,0,100); S.energy=clamp(S.energy-0.9,0,100);
    S.hygiene=clamp(S.hygiene-0.7,0,100); S.happy=clamp(S.happy-0.35,0,100);
    if(S.hour>=24){ S.hour=0; S.day++; }
    if(S.hunger<=0||S.energy<=0){ S.happy=clamp(S.happy-3,0,100); }
    updateHUD();
  }
}

/* ---------------- HUD / UI helpers ---------------- */
function updateHUD(){
  document.getElementById('money').textContent = fmt(S.money);
  document.getElementById('clock').textContent = fmtClock();
  document.getElementById('bHappy').style.width = S.happy+'%';
  document.getElementById('bHunger').style.width = S.hunger+'%';
  document.getElementById('bEnergy').style.width = S.energy+'%';
  document.getElementById('bHygiene').style.width = S.hygiene+'%';
  save();
}
function fmtClock(){
  const h=S.hour%24, ap=h<12?'AM':'PM', hh=((h+11)%12)+1;
  return `${hh}:00 ${ap} · Day ${S.day}`;
}
function toast(msg, ms=2600){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity=0; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),400); }, ms);
}
function bigTitle(txt){
  const e=document.getElementById('bigTitle'); document.getElementById('bigTitleText').textContent=txt;
  e.style.opacity=1; setTimeout(()=>e.style.opacity=0, 2200);
}
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalWrap').classList.add('open'); }
function closeModal(){ document.getElementById('modalWrap').classList.remove('open'); }
function act(label, fn, cls='', sub=''){
  return `<button class="act ${cls}" onclick="(${fn.toString()})()">${label}${sub?`<small>${sub}</small>`:''}</button>`;
}

/* ---------------- CHAT (simulated live players) ---------------- */
const CHAT_LINES = [
  "who dey go beach today? 🏖️","abeg who fit loan me 2k 😅","Lagos traffic wan kill person today",
  "this game too sweet!","I just buy new furniture for my house 🛋️","who wonna host party tonight?",
  "omo see money 💸","anybody don reach club?","I dey come market, make we link",
  "my sim just marry o!! 💍","that thug collect my money for road 😭","police finally catch those boys, thank God",
  "weather hot today 🥵","job shift done, paid!!","owambe loading this weekend 🎊"
];
let chatTimer=0, chatEvery=6;
function pushChat(name, text, me=false){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div'); d.className='cmsg'+(me?' me':'');
  d.innerHTML=`<b>@${name}</b> ${text}`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
  while(box.children.length>40) box.firstChild.remove();
}
function replyChat(userText){
  const t=userText.toLowerCase(); let r=null;
  if(/(hello|hi|hey|good)/.test(t)) r=pick(["hellooo 😍","hey hey!","how you dey?","welcome!"]);
  else if(/(party|owambe)/.test(t)) r=pick(["owambe!! 🎉","I'm down, where at?","host am, we dey come!"]);
  else if(/(money|rich|broke|job)/.test(t)) r=pick(["go office do shift jare","hustle o 😤","I just collect salary 💰"]);
  else if(/(marry|love|babe|boyfriend|girlfriend)/.test(t)) r=pick(["love is in the air 💕","go church go marry 😂","find bae for beach o"]);
  else if(/(thug|rob|police)/.test(t)) r=pick(["those boys again?!","report them to police station","stay for main road o"]);
  else if(/(house|rent)/.test(t)) r=pick(["Yaba soft 🔥","your house fine o","buy furniture from Palms Mall"]);
  if(r) setTimeout(()=>pushChat(pick(NAMES), r), rand(1200,3200));
}
function sendChat(){
  const i=document.getElementById('chatText'); const v=i.value.trim(); if(!v)return;
  pushChat('scar_belle', v.replace(/</g,'&lt;'), true); i.value=''; replyChat(v);
}
document.getElementById('chatText').addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });
function toggleChat(){ document.getElementById('chatPanel').classList.toggle('open'); }
document.getElementById('chatToggle').onclick=toggleChat;
function chatTick(dt){
  chatTimer+=dt;
  if(chatTimer>chatEvery){ chatTimer=0; chatEvery=rand(5,12);
    pushChat(pick(NAMES), pick(CHAT_LINES));
    document.getElementById('onlineCount').textContent = irand(9,24);
  }
}

/* ---------------- PLAYER movement ---------------- */
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()==='e') tryInteract(); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
let clickTarget=null;
cv.addEventListener('click',e=>{
  if(S.mode!=='map') return;
  const r=cv.getBoundingClientRect();
  const wx=e.clientX - r.left + cam.x, wy=e.clientY - r.top + cam.y;
  // clicked a location?
  for(const l of LOCS){ if(Math.hypot(wx-l.x,wy-l.y)<60){ openLocMenu(l); return; } }
  // clicked a player?
  for(const p of PLAYERS){ if(Math.hypot(wx-p.x,wy-p.y)<30){ openPlayerMenu(p); return; } }
  clickTarget={x:wx,y:wy};
});
let cam={x:0,y:0};
function movePlayer(dt){
  let dx=0,dy=0,sp=170;
  if(keys['w']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['arrowright'])dx+=1;
  if(dx||dy){ clickTarget=null; const m=Math.hypot(dx,dy); S.x+=dx/m*sp*dt; S.y+=dy/m*sp*dt; walking=true; }
  else if(clickTarget){
    const d=dist(S,clickTarget), m=Math.hypot(clickTarget.x-S.x,clickTarget.y-S.y)||1;
    if(d>6){ S.x+=(clickTarget.x-S.x)/m*sp*dt; S.y+=(clickTarget.y-S.y)/m*sp*dt; walking=true; }
    else { clickTarget=null; walking=false; }
  } else walking=false;
  S.x=clamp(S.x,40,WORLD.w-40); S.y=clamp(S.y,40,WORLD.h-40);
}
let walking=false, walkPhase=0;

/* ---------------- INTERACTION ---------------- */
let nearLoc=null;
function scanNearby(){
  nearLoc=null; let best=90;
  for(const l of LOCS){ const d=dist(S,l); if(d<best){ best=d; nearLoc=l; } }
  const p=document.getElementById('prompt');
  if(S.mode==='map'){
    if(nearLoc){ p.style.display='block'; p.textContent=`Press E — enter ${nearLoc.name} ${nearLoc.emoji}`; }
    else p.style.display='none';
  } else p.style.display='none';
}
function tryInteract(){ if(nearLoc && S.mode==='map') openLocMenu(nearLoc); }

function openLocMenu(l){
  switch(l.id){
    case 'home': homeMenu(); break;
    case 'beach': beachMenu(); break;
    case 'office': officeMenu(); break;
    case 'market': marketMenu(); break;
    case 'club': clubMenu(); break;
    case 'gym': gymMenu(); break;
    case 'police': policeMenu(); break;
    case 'church': churchMenu(); break;
    case 'salon': salonMenu(); break;
    case 'resto': restoMenu(); break;
    case 'shop': shopMenu(); break;
  }
}

/* ---------- HOME ---------- */
function homeMenu(){
  openModal(`
    <h2>🏠 ${S.home}</h2><div class="sub">Your self-contain in Yaba. Rent paid weekly.</div>
    ${act('🛏️ Sleep (restore energy)', ()=>{ doSleep(); },'green','free')}
    ${act('🍳 Cook & eat from cooler', ()=>{ eatHome(); },'','uses food stock')}
    ${act('🛋️ Buy furniture / groceries', ()=>{ shopMenu(true); })}
    ${act('🎊 Host house party', ()=>{ hostParty('home'); })}
    ${act('👶 Family', ()=>{ familyMenu(); })}
    ${act('🚪 Step outside', ()=>{ closeModal(); })}
  `);
}
function doSleep(){
  closeModal(); S.energy=100; S.hygiene=clamp(S.hygiene+10,0,100);
  S.hour=(S.hour+8)%24; if(S.hour<8) S.day++;
  S.hunger=clamp(S.hunger-25,0,100);
  bigTitle('☀️ Good morning, beautiful day in Lagos');
  toast('You slept well. Energy full!'); updateHUD();
}
function eatHome(){
  if(S.money<800){ toast('Not enough money for groceries (₦800)'); return; }
  S.money-=800; S.hunger=clamp(S.hunger+45,0,100); S.happy=clamp(S.happy+4,0,100);
  closeModal(); toast('🍛 You cooked a nice meal. Hunger restored!'); updateHUD();
}
function familyMenu(){
  if(!S.married){
    openModal(`<h2>💕 Family</h2><div class="sub">You're single. Go meet someone special! Try the beach or club — or chat with online players. 💒 Get married at the chapel.</div>${act('😌 Close',()=>closeModal())}`);
    return;
  }
  openModal(`
    <h2>💕 The ${S.spouse.name} Family</h2><div class="sub">Married to @${S.spouse.name} 💍</div>
    ${S.baby
      ? act('👶 Spend time with baby', ()=>{ S.happy=clamp(S.happy+15,0,100); S.energy=clamp(S.energy-10,0,100); closeModal(); toast('👶 Family time! Happiness up!'); updateHUD(); },'green')
      : act('🍼 Try for a baby', ()=>{ tryForBaby(); },'green','private family moment')}
    ${act('💑 Quality time with spouse', ()=>{ S.happy=clamp(S.happy+12,0,100); S.hunger=clamp(S.hunger-8,0,100); closeModal(); toast(`💑 Lovely evening with @${S.spouse.name}`); updateHUD(); })}
    ${act('Back', ()=>homeMenu())}
  `);
}
function tryForBaby(){
  closeModal();
  toast('💕 A beautiful private evening together...');
  setTimeout(()=>{
    if(Math.random()<0.65){ S.baby=true; bigTitle('👶 Congratulations! You\'re expecting!'); pushChat(S.spouse.name,'BABY ON THE WAY!! 🍼👶'); }
    else toast('Not this time... try again another day 💕');
    updateHUD();
  }, 2500);
}

/* ---------- BEACH ---------- */
function beachMenu(){
  openModal(`
    <h2>🏖️ Elegushi Beach · Lekki</h2><div class="sub">The bass is shaking the sand.</div>
    ${act('🏊 Swim in the Atlantic', ()=>{ payTime(1500,8,'hunger',6,'🏊 You swam in the ocean!'); },'','₦1,500')}
    ${act('🍢 Suya & Chapman on the sand', ()=>{ payTime(1200,10,'hunger',25,'🍢 That suya HIT different!'); },'','₦1,200')}
    ${act('🐎 Ride a horse', ()=>{ payTime(3000,8,'happy',12,'🐎 Beach horse ride, so fancy!'); },'','₦3,000')}
    ${act('🎉 Attend beach rave', ()=>{ beachRave(); },'green','₦2,500')}
    ${act('📸 Beach photoshoot', ()=>{ payTime(5000,6,'happy',8,'📸 Pics for the gram!'); },'','₦5,000')}
    ${act('Back to map', ()=>closeModal())}
  `);

/* ---------- TRAVEL ---------- */
const MODES = [
  { id:'trek',  name:'Trek',  icon:'🚶', cost:0,    speed:55, max:20 },
  { id:'keke',  name:'Keke',  icon:'🛺', cost:100,  speed:170 },
  { id:'danfo', name:'Danfo', icon:'🚌', cost:100,  speed:190 },
  { id:'okada', name:'Okada', icon:'🏍️', cost:350,  speed:320 },
  { id:'cab',   name:'Cab',   icon:'🚕', cost:650,  speed:520 },
];
let travelling=null;
function travelMenu(){
  let rows='';
  for(const l of LOCS){
    if(l.id==='home' && dist(S,l)<100) continue;
    rows += `<button class="act" onclick="pickMode('${l.id}')"><span>${l.emoji} ${l.name}</span><small>${Math.round(dist(S,l)/10)*10}m away</small></button>`;
  }
  openModal(`<h2>🚕 Travel</h2><div class="sub">Where to? (pick a destination)</div>${rows}`);
}
function pickMode(destId){
  const d = dist(S, loc(destId));
  let rows='';
  for(const m of MODES){
    const t = m.id==='trek' ? Math.min(m.max, d/60) : d/m.speed;
    rows += `<button class="act ${m.id==='cab'?'green':''}" onclick="startTravel('${destId}','${m.id}')"><span>${m.icon} ${m.name}</span><small>${m.cost?fmt(m.cost):'Free'} · ${t.toFixed(0)}s</small></button>`;
  }
  openModal(`<h2>${loc(destId).emoji} ${loc(destId).name}</h2><div class="sub">Choose transport (trekking max 20s)</div>${rows}<button class="act" onclick="travelMenu()">⬅ Back</button>`);
}
function startTravel(destId, modeId){
  const m = MODES.find(x=>x.id===modeId), l = loc(destId);
  if(S.money<m.cost){ toast(`You need ${fmt(m.cost)} for ${m.name}.`); return; }
  S.money-=m.cost; updateHUD(); closeModal();
  const d = dist(S,l);
  const dur = m.id==='trek' ? Math.min(m.max, d/60) : clamp(d/m.speed, 1.2, 15);
  travelling = { from:{x:S.x,y:S.y}, to:l, t:0, dur, mode:m };
  bigTitle(`${m.icon} ${m.name} ride...`);
}
function travelTick(dt){
  if(!travelling) return false;
  const tr=travelling; tr.t+=dt;
  const k=clamp(tr.t/tr.dur,0,1);
  const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; // easeInOut
  S.x = tr.from.x + (tr.to.x-tr.from.x)*e;
  S.y = tr.from.y + (tr.to.y-tr.from.y)*e;
  walking = tr.mode.id==='trek';
  if(k>=1){
    travelling=null; walking=false;
    toast(`📍 Arrived: ${tr.to.name} ${tr.to.emoji}`);
    if(tr.to.id==='beach') pushChat(pick(NAMES),'welcome to the beach!! 🏖️');
    openLocMenu(tr.to);
  }
  return true;
}

/* ---------------- DRAWING ---------------- */
function drawHuman(x,y,color,scale=1,phase=0,emoji){
  cx.save(); cx.translate(x,y);
  const bob = Math.sin(phase)*2*scale;
  // shadow
  cx.fillStyle='rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(0,14*scale,12*scale,4*scale,0,0,7); cx.fill();
  // legs
  cx.strokeStyle='#1f2937'; cx.lineWidth=5*scale; cx.lineCap='round';
  const lp = Math.sin(phase)*7*scale;
  cx.beginPath(); cx.moveTo(-3*scale,2*scale+bob*.3); cx.lineTo(-3*scale+lp,14*scale); cx.stroke();
  cx.beginPath(); cx.moveTo(3*scale,2*scale+bob*.3); cx.lineTo(3*scale-lp,14*scale); cx.stroke();
  // body
  cx.fillStyle=color.shirt||'#facc15';
  roundRect(-8*scale,-20*scale+bob*.3,16*scale,22*scale,6*scale); cx.fill();
  // head
  cx.fillStyle=color.skin||'#8d5524';
  cx.beginPath(); cx.arc(0,-28*scale+bob*.3,8*scale,0,7); cx.fill();
  cx.fillStyle='#111'; cx.beginPath(); cx.arc(0,-31*scale+bob*.3,8*scale,Math.PI,2*Math.PI); cx.fill();
  cx.restore();
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

function drawWorld(){
  // grass base
  cx.fillStyle='#9ccc65'; cx.fillRect(0,0,WORLD.w,WORLD.h);
  // lagoon
  cx.fillStyle='#4fc3f7';
  cx.fillRect(2050,1200,600,520);
  cx.fillStyle='#0288d1'; cx.font='bold 34px sans-serif'; cx.fillText('LAGOS LAGOON 🌊', 2080, 1290);
  // sand near beach
  cx.fillStyle='#ffe082'; cx.fillRect(2050,1120,600,90);
  // roads
  cx.fillStyle='#78909c';
  for(const y of ROADS_H) cx.fillRect(0,y-28,WORLD.w,56);
  for(const x of ROADS_V) cx.fillRect(x-28,0,56,WORLD.h);
  // road dashes
  cx.strokeStyle='rgba(255,255,255,.6)'; cx.lineWidth=3; cx.setLineDash([24,20]);
  for(const y of ROADS_H){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(WORLD.w,y); cx.stroke(); }
  for(const x of ROADS_V){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,WORLD.h); cx.stroke(); }
  cx.setLineDash([]);
  // sidewalks
  cx.fillStyle='rgba(255,255,255,.25)';
  for(const y of ROADS_H){ cx.fillRect(0,y-38,WORLD.w,6); cx.fillRect(0,y+32,WORLD.w,6); }
}
function drawLoc(l){
  // plot
  cx.fillStyle=l.color; cx.strokeStyle='rgba(0,0,0,.15)'; cx.lineWidth=2;
  roundRect(l.x-55,l.y-45,110,90,14); cx.fill(); cx.stroke();
  cx.font='40px sans-serif'; cx.textAlign='center';
  cx.fillText(l.emoji,l.x,l.y+6);
  // label
  cx.font='600 13px sans-serif';
  const tw=cx.measureText(l.name).width+18;
  cx.fillStyle='rgba(255,255,255,.95)';
  roundRect(l.x-tw/2,l.y-78,tw,24,12); cx.fill();
  cx.fillStyle='#1f2937'; cx.fillText(l.name,l.x,l.y-61);
  cx.textAlign='left';
}
function drawPlayerCharacter(){
  const moving = walking || travelling;
  if(moving) walkPhase += 0.15;
  // crown if rich
  if(S.money>=1000000){ cx.font='22px sans-serif'; cx.fillText('👑',S.x-11,S.y-52); }
  drawHuman(S.x,S.y,{shirt:'#fbbf24',skin:'#8d5524'},1.15,walkPhase);
  // ring indicator if married
  if(S.married){ cx.font='14px sans-serif'; cx.fillText('💍',S.x+12,S.y-38); }
  if(S.baby){ cx.font='13px sans-serif'; cx.fillText('👶',S.x-24,S.y-38); }
  // name
  cx.font='700 12px sans-serif'; cx.textAlign='center';
  cx.fillStyle='#0a7a4a'; cx.fillText('@scar_belle (you)',S.x,S.y-58);
  cx.textAlign='left';
}
function drawNPCs(){
  for(const p of PEDS){
    p.x += p.dir*p.speed*0.016;
    if(p.x<0)p.x=WORLD.w; if(p.x>WORLD.w)p.x=0;
    drawHuman(p.x,p.y,{shirt:'#94a3b8',skin:p.color},0.95,p.x*0.05);
  }
}
function drawPlayers(dt){
  for(const p of PLAYERS){
    p.idle+=dt;
    if(p.idle>rand(4,9) || dist(p,{x:p.tx,y:p.ty})<10){
      p.idle=0; p.tx=clamp(p.x+rand(-260,260),100,WORLD.w-100); p.ty=clamp(p.y+rand(-260,260),100,WORLD.h-100);
      // prefer sidewalks
      if(Math.random()<0.5) p.ty=pick(ROADS_H)+pick([-SIDE,SIDE]);
    }
    const d=dist(p,{x:p.tx,y:p.ty});
    if(d>4){ const m=Math.hypot(p.tx-p.x,p.ty-p.y); p.x+=p.tx-p.x>=0?1:-1; p.x+=( (p.tx-p.x)/m )*p.speed*dt; p.y+=( (p.ty-p.y)/m )*p.speed*dt; }
    const isBoo = (S.partner&&S.partner.name===p.name)||(S.spouse&&S.spouse.name===p.name);
    drawHuman(p.x,p.y,{shirt:pickShirt(p),skin:p.color},1.0,p.x*0.05);
    cx.font='600 11px sans-serif'; cx.textAlign='center';
    cx.fillStyle=isBoo?'#e11d48':'#374151';
    cx.fillText('@'+p.name+(isBoo?' 💕':''),p.x,p.y-48);
    cx.textAlign='left';
  }
}
const SHIRTCACHE={};
function pickShirt(p){ if(!SHIRTCACHE[p.name]) SHIRTCACHE[p.name]=pick(['#f472b6','#60a5fa','#34d399','#f87171','#a78bfa','#fbbf24']); return SHIRTCACHE[p.name]; }
function drawCars(){
  for(const c of CARS){
    c.x += c.dir*c.speed*0.016;
    if(c.dir>0 && c.x>WORLD.w+60) c.x=-60;
    if(c.dir<0 && c.x<-60) c.x=WORLD.w+60;
    cx.save(); cx.translate(c.x,c.y); if(c.dir<0)cx.scale(-1,1);
    if(c.kind==='keke'){
      cx.fillStyle='#facc15'; roundRect(-16,-10,32,20,5); cx.fill();
      cx.fillStyle='#111'; cx.beginPath(); cx.arc(-8,12,5,0,7); cx.arc(8,12,5,0,7); cx.fill();
    } else {
      cx.fillStyle=c.color; roundRect(-22,-11,44,22,7); cx.fill();
      cx.fillStyle='rgba(180,220,255,.9)'; roundRect(-8,-9,16,10,3); cx.fill();
      cx.fillStyle='#111'; cx.beginPath(); cx.arc(-12,12,5,0,7); cx.arc(12,12,5,0,7); cx.fill();
    }
    cx.restore();
  }
}
function drawHouseInterior(){
  // cozy room
  cx.fillStyle='#7c4a1e'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#a86b32'; cx.fillRect(0,0,W,H*0.62);
  cx.fillStyle='#d9a05b';
  for(let i=0;i<12;i++)for(let j=0;j<8;j++){ if((i+j)%2===0){ cx.fillRect(i*140-((j%2)*70),H*0.62+j*50,140,50); } }
  // furniture
  const items={ bed:['🛏️',.2,.66], chair:['🪑',.45,.74], cooler:['🧊',.8,.68], sofa:['🛋️',.6,.66], tv:['📺',.5,.45], fridge:['🧊',.9,.6] };
  cx.textAlign='center';
  for(const f of S.furniture){ const it=items[f]; if(!it)continue; cx.font=(f==='tv'?'90px':'110px')+' sans-serif'; cx.fillText(it[0],W*it[1],H*it[2]); }
  // spouse & baby
  if(S.married){ cx.font='90px sans-serif'; cx.fillText('🧑🏾',W*0.32,H*0.72);
    cx.font='600 13px sans-serif'; cx.fillStyle='#fff'; cx.fillText('@'+S.spouse.name+' 💍',W*0.32,H*0.76); }
  if(S.baby){ cx.font='44px sans-serif'; cx.fillText('👶',W*0.4,H*0.76); }
  cx.font='bold 26px sans-serif'; cx.fillStyle='#fff';
  cx.fillText('🏠 '+S.home+'  ·  click Phone → Home menu',W/2,60);
  cx.textAlign='left';
}

/* ---------------- MAIN LOOP ---------------- */
let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000||0.016); last=t;
  tickTime(dt); chatTick(dt); thugTick(dt);

  if(S.mode==='map'){
    if(!travelTick(dt)) movePlayer(dt);
    scanNearby();
    // camera
    cam.x = clamp(S.x-W/2,0,Math.max(0,WORLD.w-W));
    cam.y = clamp(S.y-H/2,0,Math.max(0,WORLD.h-H));
    cx.save(); cx.translate(-cam.x,-cam.y);
    drawWorld();
    for(const l of LOCS) drawLoc(l);
    drawNPCs(); drawCars(); drawPlayers(dt);
    drawPlayerCharacter();
    // travel vehicle overlay
    if(travelling && travelling.mode.id!=='trek'){
      cx.font='42px sans-serif'; cx.textAlign='center';
      cx.fillText(travelling.mode.icon,S.x,S.y-8); cx.textAlign='left';
    }
    cx.restore();
  } else {
    drawHouseInterior();
  }
  requestAnimationFrame(loop);
}

/* ---------------- BOOT ---------------- */
updateHUD();
bigTitle("💕 scar_belle's love life");
pushChat('system','👋 Welcome to Lagos! Find work, find love, live large.');
setTimeout(()=>pushChat(pick(NAMES),'new here? welcome!! 🎉'), 2500);
setTimeout(()=>toast('🚶 Move: WASD / click · Press E near buildings · Everyone you see is "online" — click them!'), 1500);
requestAnimationFrame(loop);
</script>
</body>
</html>
