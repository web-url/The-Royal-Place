const $=id=>document.getElementById(id);
function updateHUD(){$('money').textContent=fmt(S.money);$('clock').textContent=fmtClock();
 $('bHappy').style.width=S.happy+'%';$('bHunger').style.width=S.hunger+'%';$('bEnergy').style.width=S.energy+'%';save();}

 d.innerHTML=`<b>@${n}</b> ${t}`;b.appendChild(d);b.scrollTop=b.scrollHeight;while(b.children.length>40)b.firstChild.remove();}

 if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;

  if(d>6){S.x+=(clickT.x-S.x)/m*sp*dt;S.y+=(clickT.y-S.y)/m*sp*dt;walking=true}else{clickT=null;walking=false}}
 else walking=false;
 const b=bounds();S.x=clamp(S.x,30,b.w-30);S.y=clamp(S.y,30,b.h-30);}

/* ============ INTERIOR enter/exit ============ */
function enterInterior(id){
 inside=id;const d=INTERIORS[id];clickT=null;
 S.x=d.w/2;S.y=d.h-80;
 sceneNPCs=[];const pool=[...PDEF].sort(()=>Math.random()-.5);
 for(let i=0;i<d.npcN;i++){const pd=pool[i%pool.length];
  sceneNPCs.push(mkNpc(rand(150,d.w-150),rand(140,d.h-160),pd));}
 if(id==='home'&&S.married){sceneNPCs.push(mkNpc(d.w/2+80,d.h-160,{name:S.spouse.name,skin:'#8d5524',shirt:'#f472b6',emoji:'🧑'}));}
 if(id==='office')sceneNPCs[0].name='Boss_'+sceneNPCs[0].name;
 if(id==='police')sceneNPCs[0].name='Officer_'+sceneNPCs[0].name;
 if(id==='church')sceneNPCs[0].name='Pastor_Ade';
 $('nHome').innerHTML='<span>🚪</span>Exit bldg';
 $('saybar').style.display='block';
 $('chips').innerHTML=d.chips.map(c=>`<button class="chip" onclick="chipAct('${c}')">${c}</button>`).join('');
 bigTitle(d.emoji+' '+d.name);
 toast(d.greet);
 pushChat(pick(NAMES),'I dey '+d.name+' now! '+d.emoji);
}
function exitInterior(){inside=null;sceneNPCs=[];bubbles=[];clickT=null;
 const l=loc(S._lastLoc||'home');S.x=l.x;S.y=l.y+120;
 $('saybar').style.display='none';$('nHome').innerHTML='<span>🏠</span>Home';}
$('nHome').onclick=()=>{if(inside)exitInterior();else{if(dist(S,loc('home'))<140)enterInterior('home');else travelTo('home')}};

/* ============ NPC proximity + talk ============ */
let nearNpc=null;
function scanNpc(){nearNpc=null;if(!inside)return;let best=70;
 for(const p of sceneNPCs){const d=dist(S,p);if(d<best){best=d;nearNpc=p}}
 const pr=$('prompt');
 if(nearNpc){pr.style.display='block';pr.textContent=`Press E — talk to @${nearNpc.name}`}
 else if(!inside){let bl=null,bd=95;for(const l of LOCS){const d=dist(S,l);if(d<bd){bd=d;bl=l}}
  if(bl){pr.style.display='block';pr.textContent=`Press E — enter ${bl.emoji} ${bl.name}`}else pr.style.display='none';}
 else pr.style.display='none';}
function tryInteract(){if(inside&&nearNpc)talkMenu(nearNpc);else if(!inside){for(const l of LOCS)if(dist(S,l)<95){enterInterior(l.id);return}}}
function relOf(p){if(!S.rel[p.name])S.rel[p.name]={lvl:0};return S.rel[p.name];}
function talkMenu(p){
 const r=relOf(p),isBoo=S.partner&&S.partner.name===p.name,isSp=S.spouse&&S.spouse.name===p.name;
 const greetLines=["how you dey? 😄","omo you fine o","wetin dey happen?","you come here often? 😏","lagos no easy my guy","make we gist!"];
 openModal(`
  <h2>${p.emoji} @${p.name}</h2>
  <div class="sub">"${pick(greetLines)}" · ${isSp?'💍 your spouse':isBoo?`💕 your boo (level ${S.partner.lvl}/5)`:'online player'}${r.lvl>0&&!isBoo&&!isSp?` · friend lvl ${r.lvl}`:''}</div>
  <button class="act" onclick="npcChat('${p.name}')">💬 Chat <small>free</small></button>
  <button class="act" onclick="npcCompliment('${p.name}')">🥰 Compliment <small>+friendship</small></button>
  ${(!S.partner&&!S.married&&!isBoo)?`<button class="act green" onclick="npcAskOut('${p.name}')">💘 Ask to be your boo</button>`:''}
  ${isBoo?`<button class="act green" onclick="npcDate('${p.name}')">💑 Date night <small>₦8,000 · lvl ${S.partner.lvl}/5</small></button>
  <button class="act" onclick="npcGift('${p.name}')">🎁 Gift <small>₦10,000 · +1 lvl</small></button>`:''}
  ${isBoo&&S.partner.lvl>=5?`<button class="act green" onclick="npcPropose('${p.name}')">💍 PROPOSE <small>ring ₦50,000</small></button>`:''}
  <button class="act" onclick="closeModal()">👋 Bye</button>`);
}
function findNpc(n){return sceneNPCs.find(p=>p.name===n)}
function npcChat(n){const p=findNpc(n);closeModal();
 say('me',S.x,S.y-70,pick(["how you dey?","you fine o 😍","wetin dey?","make we vibe!","enjoying Lagos?"]));
 setTimeout(()=>{if(p)say(n,p.x,p.y-70,roomReply('hello'))},900);
 relOf(p).lvl++;S.happy=clamp(S.happy+2,0,100);updateHUD();}
function npcCompliment(n){const p=findNpc(n);closeModal();
 say('me',S.x,S.y-70,pick(["you too fine! 😍","I like your vibes","you dey glow today ✨"]));
 setTimeout(()=>{if(p)say(n,p.x,p.y-70,pick(["aww 🥰","stop it ☺️","you sef fine o!","thank you love 💕"]))},1000);
 relOf(p).lvl++;S.happy=clamp(S.happy+3,0,100);updateHUD();}
function npcAskOut(n){const p=findNpc(n);closeModal();
 if(S.partner){toast(`You're dating @${S.partner.name} already!`);return}
 if(relOf(p).lvl<2){say(n,p.x,p.y-70,"we just met 😅 gist small first");toast('💬 Befriend them first — chat & compliment a couple times.');return}
 if(Math.random()<0.8){S.partner={name:n,lvl:1};bigTitle('💘 IT\'S A MATCH!');
  say(n,p.x,p.y-70,"YES!! I go be your boo 😍");pushChat(n,'omgg yesss 💕');
  pushChat(pick(NAMES),'new couple alert!! 🥳');toast(`💘 Dating @${n}! Grow love: date nights at 💒 chapel, gifts, compliments.`)}
 else{say(n,p.x,p.y-70,"hmm let me think 😅");toast('Not yet... build more friendship first.')}
 updateHUD();}
function npcDate(n){if(S.money<8000){toast('Date night costs ₦8,000');return}
 S.money-=8000;S.partner.lvl=clamp(S.partner.lvl+1,0,5);S.happy=clamp(S.happy+18,0,100);S.hour=(S.hour+3)%24;
 closeModal();bigTitle('💑 DATE NIGHT');pushChat(n,'best date ever 😍');
 toast(`💑 @${n} level ${S.partner.lvl}/5`);updateHUD();}
function npcGift(n){if(S.money<10000){toast('Gift costs ₦10,000');return}
 S.money-=10000;S.partner.lvl=clamp(S.partner.lvl+1,0,5);const p=findNpc(n);closeModal();
 if(p)say(n,p.x,p.y-70,"omgg a gift?! love you!! 🥺💕");pushChat(n,'my boo too sweet 🥺💕');
 toast(`🎁 Level ${S.partner.lvl}/5`);updateHUD();}
function npcPropose(n){if(S.money<50000){toast('The ring costs ₦50,000!');return}
 S.money-=50000;closeModal();bigTitle('💍 SHE SAID YES!!');
 S.married=true;S.spouse=S.partner;S.partner=null;
 pushChat(n,'I SAID YES!!! 💍💒');pushChat(pick(NAMES),'wedding loading!!! 🥳');
 setTimeout(()=>bigTitle('💒 Just Married!'),2400);toast('💒 Married! Visit 🏠 Home → 👶 Family to grow your family.');updateHUD();}

/* ============ CHIPS (quick room actions) ============ */
function chipAct(c){
 const id=inside;if(!id)return;
 if(/rave/.test(c)){if(S.money<2500){toast('₦2,500 to join the rave');return}S.money-=2500;S.happy=clamp(S.happy+22,0,100);S.energy=clamp(S.energy-15,0,100);S.hour=(S.hour+3)%24;bigTitle('🎉 BEACH RAVE!!');pushChat(pick(NAMES),'rave dey MADT 🔥');toast('🎉 You danced till sunset!')}
 else if(/DJ/.test(c)){S.happy=clamp(S.happy+10,0,100);const d=sceneNPCs[0];if(d)say(d.name,d.x,d.y-70,"THIS DJ SICK!! 🎧");toast('🎧 The DJ played your request!')}
 else if(/Suya/.test(c)){if(S.money<1200){toast('₦1,200');return}S.money-=1200;S.hunger=clamp(S.hunger+30,0,100);S.happy=clamp(S.happy+6,0,100);toast('🍢 Suya & Chapman! Belly happy.')}
 else if(/Swim/.test(c)){if(S.money<1500){toast('₦1,500');return}S.money-=1500;S.hygiene=clamp(S.hygiene-10,0,100);S.happy=clamp(S.happy+10,0,100);toast('🏊 Atlantic ocean dip!')}
 else if(/bottles/.test(c)){clubSpend(10000,26)}else if(/Dancefloor/.test(c)){clubSpend(1000,9)}else if(/Snap/.test(c)){if(S.money<2000){toast('₦2,000');return}S.money-=2000;S.happy=clamp(S.happy+7,0,100);toast('📸 Pics for the gram!')}
 else if(/Host party/.test(c)){hostParty()}
 else if(/Work shift/.test(c)){workShift()}else if(/Promotion/.test(c)){promote()}else if(/Print/.test(c)){toast('🖨️ Documents printed. Boss nods approvingly.')}
 else if(/Sleep/.test(c)){doSleep()}else if(/Cook/.test(c)){cookEat()}else if(/House party/.test(c)){hostParty()}else if(/Family/.test(c)){familyMenu()}
 else if(/Trade/.test(c)){marketHustle()}else if(/foodstuffs/.test(c)){if(S.money<1500){toast('₦1,500');return}S.money-=1500;S.hunger=clamp(S.hunger+22,0,100);toast('🥬 Fresh foodstuffs!')}else if(/asoebi/.test(c)){if(S.money<7000){toast('₦7,000');return}S.money-=7000;S.happy=clamp(S.happy+10,0,100);toast('👗 Asoebi fabric acquired!')}
 else if(/Workout/.test(c)){gymAct(2000,11,18)}else if(/Cardio/.test(c)){gymAct(1500,7,12)}else if(/Spa/.test(c)){if(S.money<4000){toast('₦4,000');return}S.money-=4000;S.hygiene=100;S.happy=clamp(S.happy+10,0,100);toast('🧖 So fresh!')}
 else if(/Report thugs/.test(c)){if(S.thugReports>0){const rw=S.thugReports*3000;S.money+=rw;S.thugReports=0;toast(`🚔 Reports acted on! Reward ${fmt(rw)}`);updateHUD()}else toast('🚔 No open cases. Report thugs when they approach you outside.')}
 else if(/permit/.test(c)){if(S.money>=5000){S.money-=5000;toast('🪪 Permit granted!');updateHUD()}else toast('₦5,000 needed')}
 else if(/Pray/.test(c)){S.happy=clamp(S.happy+6,0,100);toast('🙏 Peace of mind.');updateHUD()}
 else if(/Date night/.test(c)){if(S.partner)npcDate(S.partner.name);else toast('You need a boo first! Meet people inside buildings 💕')}
 else if(/Proposal/.test(c)){if(S.partner&&S.partner.lvl>=5)npcPropose(S.partner.name);else toast('💍 Grow your relationship to level 5 first!')}
 else if(/New hair/.test(c)){if(S.money<5000){toast('₦5,000');return}S.money-=5000;S.hygiene=clamp(S.hygiene+15,0,100);S.happy=clamp(S.happy+12,0,100);toast('💇 You look FIRE 🔥');updateHUD()}
 else if(/Mani/.test(c)){if(S.money<4000){toast('₦4,000');return}S.money-=4000;S.hygiene=clamp(S.hygiene+20,0,100);S.happy=clamp(S.happy+7,0,100);toast('💅 Soft like butter');updateHUD()}
 else if(/Amala/.test(c)){eatOut(2500,45)}else if(/Rice/.test(c)){eatOut(1200,25)}
 else if(/Furniture/.test(c)){buyItem('sofa',30000,'🛋️ Sofa')}else if(/Electronics/.test(c)){buyItem('tv',45000,'📺 TV')}else if(/Fashion/.test(c)){if(S.money<12000){toast('₦12,000');return}S.money-=12000;S.happy=clamp(S.happy+10,0,100);toast('👟 Fresh drip!');updateHUD()}
 updateHUD();}
function clubSpend(c,h){if(S.money<c){toast('Bouncer: "your money no reach" 😬');return}S.money-=c;S.happy=clamp(S.happy+h,0,100);S.energy=clamp(S.energy-18,0,100);S.hour=(S.hour+4)%24;bigTitle('🎶 OWAMBE NIGHT');pushChat(pick(NAMES),'Quilox dey POP 🍾');toast('🍾 What a night!')}
function hostParty(){if(S.money<15000){toast('Hosting costs ₦15,000');return}S.money-=15000;S.happy=100;S.energy=clamp(S.energy-25,0,100);
 bigTitle('🎊 YOUR PARTY IS LIT 🔥');
 for(let i=0;i<irand(4,9);i++)setTimeout(()=>pushChat(pick(NAMES),pick(['party madt!! 🎉','this host sabi! 🙌','owambe 🥳','we dey your party!!','champagne dey flow 🍾'])),rand(500,4000));
 for(const p of sceneNPCs)setTimeout(()=>{if(p)say(p.name,p.x,p.y-70,pick(['🥳🥳','party!!','this DJ!! 🔥','spray money! 💸']))},rand(300,2500));
 toast('🎊 Everyone pulled up!');updateHUD();}
function workShift(){const wage=9000+S.jobLevel*3500;closeModal();bigTitle('💼 Working shift...');
 setTimeout(()=>{S.money+=wage;S.energy=clamp(S.energy-20,0,100);S.hunger=clamp(S.hunger-12,0,100);S.hour=(S.hour+4)%24;S.shifts++;toast(`💼 Shift done! Paid ${fmt(wage)}`);pushChat(pick(NAMES),'salary landed 💰');updateHUD()},4000);}
function promote(){if(S.shifts<S.jobLevel*3){toast(`Boss: "do ${S.jobLevel*3-S.shifts} more shifts first"`);return}S.jobLevel++;bigTitle('📈 PROMOTED · LVL '+S.jobLevel);pushChat(pick(NAMES),'omo promotion!! 🎉');updateHUD();}
function marketHustle(){closeModal();bigTitle('🧺 Hustling...');setTimeout(()=>{const e=irand(4000,9000);S.money+=e;S.energy=clamp(S.energy-15,0,100);S.hour=(S.hour+3)%24;toast(`🧺 Earned ${fmt(e)}`);updateHUD()},3500);}
function gymAct(c,h,e){if(S.money<c){toast(fmt(c)+' needed');return}S.money-=c;S.happy=clamp(S.happy+h,0,100);S.energy=clamp(S.energy-e,0,100);toast('💪 Session complete! Feel the burn.');updateHUD();}
function eatOut(c,f){if(S.money<c){toast(fmt(c)+' needed');return}S.money-=c;S.hunger=clamp(S.hunger+f,0,100);S.happy=clamp(S.happy+5,0,100);toast('🍲 That hit the spot!');updateHUD();}
function buyItem(key,cost,label){if(S.furniture.includes(key)){toast('Already owned.');return}if(S.money<cost){toast(fmt(cost)+' needed');return}S.money-=cost;S.furniture.push(key);S.happy=clamp(S.happy+6,0,100);toast(`🛍️ ${label} delivered home!`);updateHUD();}
function doSleep(){S.energy=100;S.hygiene=clamp(S.hygiene+10,0,100);S.hour=(S.hour+8)%24;if(S.hour<8)S.day++;S.hunger=clamp(S.hunger-25,0,100);bigTitle('☀️ Good morning!');toast('You slept well. Energy full!');updateHUD();}
function cookEat(){if(S.money<800){toast('Groceries cost ₦800');return}S.money-=800;S.hunger=clamp(S.hunger+45,0,100);S.happy=clamp(S.happy+4,0,100);toast('🍛 Nice home meal!');updateHUD();}
function familyMenu(){
 if(!S.married){openModal(`<h2>💕 Family</h2><div class="sub">You're single! Meet people inside the beach, club, mall... chat, compliment, ask them out, then 💍 at the chapel.</div><button class="act" onclick="closeModal()">😌 Okay</button>`);return}
 openModal(`<h2>💕 The ${S.spouse.name} Family</h2><div class="sub">Married to @${S.spouse.name} 💍</div>
 ${S.baby?`<button class="act green" onclick="famTime()">👶 Family time <small>+happiness</small></button>`:`<button class="act green" onclick="tryBaby()">🍼 Try for a baby <small>private moment</small></button>`}
 <button class="act" onclick="closeModal()">Back</button>`);}
function famTime(){S.happy=clamp(S.happy+15,0,100);closeModal();toast('👶 Beautiful family moment!');updateHUD();}
function tryBaby(){closeModal();toast('💕 A lovely private evening together...');
 setTimeout(()=>{if(Math.random()<0.65){S.baby=true;bigTitle('👶 You\'re expecting!');pushChat(S.spouse.name,'BABY ON THE WAY 🍼')}else toast('Not this time... try another day 💕');updateHUD()},2500);}

/* ============ CITY npcs, cars, thugs, travel ============ */
const CITYPEDS=[];for(let i=0;i<26;i++)CITYPEDS.push({x:rand(50,CITY.w-50),y:pick(RH)+pick([-58,58]),dir:pick([-1,1]),speed:rand(25,55),skin:pick(['#8d5524','#a0663a','#5d4037','#c68642']),shirt:pick(['#94a3b8','#f472b6','#60a5fa','#34d399'])});
const CARS=[];for(let i=0;i<10;i++)CARS.push({x:rand(0,CITY.w),y:pick(RH)+pick([-16,16]),dir:pick([-1,1]),speed:rand(90,160),color:pick(['#facc15','#f8fafc','#ef4444','#22c55e','#3b82f6'])});
let travelling=null,thugCool=40,thugActive=false;
const MODES=[{id:'trek',n:'Trek',i:'🚶',c:0,s:55,mx:20},{id:'keke',n:'Keke',i:'🛺',c:100,s:170},{id:'danfo',n:'Danfo',i:'🚌',c:100,s:190},{id:'okada',n:'Okada',i:'🏍️',c:350,s:320},{id:'cab',n:'Cab',i:'🚕',c:650,s:520}];
function travelMenu(){if(inside){toast('🚪 Exit the building first');return}
 let rows='';for(const l of LOCS){if(dist(S,l)<110)continue;rows+=`<button class="act" onclick="pickMode('${l.id}')"><span>${l.emoji} ${l.name}</span><small>~${Math.round(dist(S,l)/10)*10}m</small></button>`}
 openModal(`<h2>🚕 Travel</h2><div class="sub">Where to?</div>${rows}`);}
function pickMode(id){const d=dist(S,loc(id));let rows='';
 for(const m of MODES){const t=m.id==='trek'?Math.min(m.mx,d/60):d/m.s;rows+=`<button class="act ${m.id==='cab'?'green':''}" onclick="startTravel('${id}','${m.id}')"><span>${m.i} ${m.n}</span><small>${m.c?fmt(m.c):'Free'} · ${t.toFixed(0)}s</small></button>`}
 openModal(`<h2>${loc(id).emoji} ${loc(id).name}</h2><div class="sub">Pick transport (trek max 20s)</div>${rows}<button class="act" onclick="travelMenu()">⬅ Back</button>`);}
function startTravel(id,mid){const m=MODES.find(x=>x.id===mid),l=loc(id);
 if(S.money<m.c){toast(fmt(m.c)+' needed for '+m.n);return}
 S.money-=m.c;updateHUD();closeModal();S._lastLoc=id;
 const d=dist(S,l),dur=m.id==='trek'?Math.min(m.mx,d/60):clamp(d/m.s,1.2,15);
 travelling={from:{x:S.x,y:S.y},to:l,t:0,dur,mode:m};bigTitle(m.i+' '+m.n+' ride...');}
function travelTo(id){startTravel(id,'cab')}
function travelTick(dt){if(!travelling)return false;const tr=travelling;tr.t+=dt;const k=clamp(tr.t/tr.dur,0,1);
 const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
 S.x=tr.from.x+(tr.to.x-tr.from.x)*e;S.y=tr.from.y+(tr.to.y-tr.from.y)*e;walking=tr.mode.id==='trek';
 if(k>=1){travelling=null;walking=false;toast('📍 Arrived: '+tr.to.name);enterInterior(tr.to.id)}return true;}
function thugTick(dt){if(inside||thugActive)return;thugCool-=dt;
 const night=S.hour>=20||S.hour<5;
 if(thugCool<=0){thugCool=night?rand(40,90):rand(90,180);
  if(dist(S,loc('police'))<260||dist(S,loc('home'))<200)return;
  if(Math.random()<(night?0.75:0.35)){thugActive=true;const demand=irand(2000,8000),nm=pick(['Shina','Rambo','Eku','Kazeem']);
  openModal(`<h2>😈 Street Thug: "${nm}"</h2><div class="sub">"Oga, drop ${fmt(demand)} make we no wound you."</div>
  <button class="act" onclick="thugPay(${demand})">💸 Pay ${fmt(demand)}</button>
  <button class="act" onclick="thugRun()">🏃 Run!</button>
  <button class="act" onclick="thugPolice()">🚔 Call police</button>`);}}}
function thugPay(d){S.money=Math.max(0,S.money-d);thugActive=false;closeModal();toast(`😈 You paid ${fmt(d)}... painful.`);updateHUD();}
function thugRun(){thugActive=false;closeModal();
 if(Math.random()<0.6)toast('🏃 You escaped!');else{const f=irand(1000,3000);S.money=Math.max(0,S.money-f);S.energy=clamp(S.energy-15,0,100);toast(`😈 They caught you! Took ${fmt(f)}`)}updateHUD();}
function thugPolice(){S.thugReports++;thugActive=false;closeModal();toast('🚔 Report filed! Collect reward at the station.');pushChat(pick(NAMES),'police dey come that axis o');updateHUD();}

let tAcc=0;
function tickTime(dt){tAcc+=dt;if(tAcc>=8){tAcc=0;S.hour++;
 S.hunger=clamp(S.hunger-1.1,0,100);S.energy=clamp(S.energy-0.9,0,100);S.hygiene=clamp(S.hygiene-0.7,0,100);S.happy=clamp(S.happy-0.35,0,100);
 if(S.hour>=24){S.hour=0;S.day++}
 if(S.hunger<=0||S.energy<=0)S.happy=clamp(S.happy-3,0,100);
